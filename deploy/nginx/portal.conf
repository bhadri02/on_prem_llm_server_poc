# deploy/nginx/portal.conf
#
# Mounted into the standalone "nginx" service (docker-compose.prod.yml) —
# a plain, unmodified nginx:alpine, deliberately kept separate from the
# portal_ui image/container. This is the platform's single public front
# door: / -> portal-ui, /portal -> admin-portal, /v1 -> api-gateway. Matches
# what Vite's dev-time proxy does locally (portal_ui/vite.config.ts) so
# portalClient.ts's relative fetch("/portal/...") / fetch("/v1/...") calls
# keep working unchanged in production — no CORS needed.
#
# Deliberately independent of whether portal_ui is deployed at all: if you
# swap it for a real frontend team's own build (a different static site, or
# a build you don't want to push to this server), change ONLY the
# "location /" block below to point at wherever that's served from — the
# /portal and /v1 rules (the actual API surface) don't need to change.
server {
    listen 80;
    server_name _;

    # Frontend — proxied to the separate portal-ui container, not served
    # from this container directly (no static files live here).
    location / {
        proxy_pass http://portal-ui:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Portal API (users/roles/keys, audit, governance, chat proxy, ...)
    location /portal/ {
        proxy_pass http://admin-portal:8084/portal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Real chat completions via API Gateway (used by ChatView's direct path,
    # if ever wired to call /v1 instead of the admin_portal proxy)
    location /v1/ {
        proxy_pass http://api-gateway:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
