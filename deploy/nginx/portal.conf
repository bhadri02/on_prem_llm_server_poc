# deploy/nginx/portal.conf
#
# Mounted over the portal_ui image's baked-in default.conf (see
# docker-compose.prod.yml). Makes the portal_ui container the single
# front door for the whole platform on one origin/port, matching what
# Vite's dev-time proxy does locally (portal_ui/vite.config.ts) so
# portalClient.ts's relative fetch("/portal/...") / fetch("/v1/...")
# calls keep working unchanged in production — no CORS, no separate
# reverse-proxy container needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin Portal API (users/roles/keys, audit, governance, chat proxy, ...)
    location /portal/ {
        proxy_pass http://admin-portal:8084/portal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Real chat completions via API Gateway (used by ChatView's direct path,
    # if ever wired to call /v1 instead of the admin_portal proxy)
    location /v1/ {
        proxy_pass http://api-gateway:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
