# docker-compose.local.yml
# Starts ONLY the infrastructure services needed for local development.
# Python services (api_gateway, security_layer, etc.) run directly via run-local.ps1
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down

services:
  redis:
    image: redis:7-alpine
    container_name: llm-poc-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: llm-poc-postgres
    environment:
      POSTGRES_DB: llm_platform
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: llm_pass
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Distributed tracing backend — receives OTLP spans from any service
  # started with TRACING_ENABLED=true (see local.env). Optional: services
  # gracefully no-op if this container isn't running or opentelemetry-*
  # packages aren't installed. UI at http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: llm-poc-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
    restart: unless-stopped

volumes:
  postgres_data:
