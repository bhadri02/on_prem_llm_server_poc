# docker-compose.prod.yml
#
# Full on-prem production stack: every backend service, portal_ui, Postgres,
# Redis, and Ollama, all containerized and networked by service name.
#
# Unlike docker-compose.local.yml (infra only — Python services run directly
# via run-local.ps1 for fast local iteration), this file runs EVERYTHING as
# containers. See docs/DEPLOYMENT.md for the full step-by-step procedure.
#
# Secrets and a handful of deploy-time choices come from .env.prod (copy
# .env.prod.example and fill it in — see docs/DEPLOYMENT.md). Everything
# else (internal URLs, ports) is fixed here since it's determined by this
# file's own service names, not something an operator needs to configure.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.prod.yml --env-file .env.prod logs -f
#   docker compose -f docker-compose.prod.yml --env-file .env.prod down

# Fixed project name — without this, Compose derives the project name (and
# therefore every volume/network name) from the current directory, which is
# also what docker-compose.local.yml resolves to from this same directory.
# Without a fixed name here, `up`-ing this file after ever having run
# docker-compose.local.yml silently reuses that file's postgres_data/
# redis_data volumes (same seeded DB, same admin password) instead of
# starting fresh — surprising, and exactly what happened during this
# project's own validation of this file.
name: llm-platform-prod

x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: llm-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: llm_platform
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: llm-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Uncomment to pass through an NVIDIA GPU (requires the nvidia-container-toolkit
    # on the host — see docs/DEPLOYMENT.md's GPU section):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot job: pulls the configured model(s) into the ollama volume, then
  # exits. Safe to re-run (`ollama pull` is a no-op if already present).
  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: llm-ollama-model-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        ollama pull "${OLLAMA_DEFAULT_MODEL:-llama3.2:3b}"
        if [ -n "${OLLAMA_EXTRA_MODELS:-}" ]; then
          for m in ${OLLAMA_EXTRA_MODELS}; do ollama pull "$$m"; done
        fi
    restart: "no"

  # ---------------------------------------------------------------------
  # Platform services
  # ---------------------------------------------------------------------
  model-registry:
    build:
      context: .
      dockerfile: model_registry/Dockerfile
    container_name: llm-model-registry
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?REGISTRY_API_KEY must be set in .env.prod}
    volumes:
      - model_registry_data:/data
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]

  audit-store:
    build:
      context: .
      dockerfile: audit_store/Dockerfile
    container_name: llm-audit-store
    restart: unless-stopped
    environment:
      LOG_LEVEL: INFO
      AUDIT_API_KEY: ${AUDIT_API_KEY:?AUDIT_API_KEY must be set in .env.prod}
    volumes:
      - audit_store_data:/data
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/health')"]

  admin-portal:
    build:
      context: .
      dockerfile: admin_portal/Dockerfile
    container_name: llm-admin-portal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      audit-store:
        condition: service_healthy
      model-registry:
        condition: service_healthy
    environment:
      LOG_LEVEL: INFO
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?GATEWAY_API_KEY must be set in .env.prod}
      ADMIN_PORTAL_INTERNAL_KEY: ${ADMIN_PORTAL_INTERNAL_KEY:?ADMIN_PORTAL_INTERNAL_KEY must be set in .env.prod}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set in .env.prod}
      DATABASE_URL: "postgresql://llm_user:${POSTGRES_PASSWORD}@postgres:5432/llm_platform"
      API_GATEWAY_URL: "http://api-gateway:8080"
      AUDIT_STORE_URL: "http://audit-store:9200"
      MODEL_REGISTRY_URL: "http://model-registry:5000"
      REGISTRY_API_KEY: ${REGISTRY_API_KEY}
      OLLAMA_BASE_URL: "http://ollama:11434"
      PROMETHEUS_URL: "http://prometheus:9090"
      GRAFANA_URL: "http://grafana:3000"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/portal/health')"]

  security-layer:
    build:
      context: .
      dockerfile: security_layer/Dockerfile
    container_name: llm-security-layer
    restart: unless-stopped
    depends_on:
      audit-store:
        condition: service_healthy
    environment:
      LOG_LEVEL: INFO
      AUDIT_API_KEY: ${AUDIT_API_KEY}
      AUDIT_STORE_URL: "http://audit-store:9200"
      DOWNSTREAM_ROUTER_URL: "http://router:8082"
      INJECTION_PATTERNS_PATH: "injection_patterns.yaml"
      PII_ENABLED: "true"
      ROUTER_TIMEOUT_SECONDS: "600"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]

  router:
    build:
      context: .
      dockerfile: intelligent_router/Dockerfile
    container_name: llm-router
    restart: unless-stopped
    depends_on:
      audit-store:
        condition: service_healthy
      admin-portal:
        condition: service_healthy
    environment:
      LOG_LEVEL: INFO
      AUDIT_API_KEY: ${AUDIT_API_KEY}
      AUDIT_STORE_URL: "http://audit-store:9200"
      MODEL_MATRIX_PATH: "model_matrix.yaml"
      TASK_RULES_PATH: "task_classifier_rules.yaml"
      POLICY_MATRIX_PATH: "policy_matrix.yaml"
      CACHE_URL: "http://cache:8086"
      INFERENCE_ADAPTER_URL: "http://inference-adapter:8087"
      INFERENCE_TIMEOUT_SECONDS: "600"
      ADMIN_PORTAL_URL: "http://admin-portal:8084"
      ADMIN_PORTAL_INTERNAL_KEY: ${ADMIN_PORTAL_INTERNAL_KEY}
    volumes:
      # Bind-mount the routable model/policy/task-classifier config so it can
      # be edited without rebuilding the image (and to guarantee the current
      # repo-root files are used, overriding whatever was baked in at build
      # time). Restart this service after editing any of these.
      #
      # model_matrix.docker.yaml (not model_matrix.yaml) — see that file's
      # header: it's identical except health_url/endpoint point at the
      # "ollama" service hostname instead of "localhost", which is what
      # this container's own loopback actually resolves to.
      - ./model_matrix.docker.yaml:/app/model_matrix.yaml:ro
      - ./task_classifier_rules.yaml:/app/task_classifier_rules.yaml:ro
      - ./policy_matrix.yaml:/app/policy_matrix.yaml:ro
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]

  cache:
    build:
      context: .
      dockerfile: cache_service/Dockerfile
    container_name: llm-cache
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LOG_LEVEL: INFO
      REDIS_URL: "redis://redis:6379"
      SIMILARITY_THRESHOLD: "0.90"
      EMBEDDING_MODEL: "all-MiniLM-L6-v2"
      CACHE_TTL_SECONDS: "60"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')"]

  inference-adapter:
    build:
      context: .
      dockerfile: inference_adapter/Dockerfile
    container_name: llm-inference-adapter
    restart: unless-stopped
    depends_on:
      ollama-model-pull:
        condition: service_completed_successfully
      model-registry:
        condition: service_healthy
    environment:
      LOG_LEVEL: INFO
      OLLAMA_BASE_URL: "http://ollama:11434"
      DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT_SECONDS: "600"
      MODEL_REGISTRY_URL: "http://model-registry:5000"
      REGISTRY_API_KEY: ${REGISTRY_API_KEY}
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health')"]

  agent-framework:
    build:
      context: .
      dockerfile: services/agent-framework/Dockerfile
    container_name: llm-agent-framework
    restart: unless-stopped
    depends_on:
      router:
        condition: service_healthy
    environment:
      LOG_LEVEL: INFO
      ROUTER_URL: "http://router:8082"
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      MAX_AGENT_STEPS: "10"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]

  api-gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    container_name: llm-api-gateway
    restart: unless-stopped
    depends_on:
      security-layer:
        condition: service_healthy
      admin-portal:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LOG_LEVEL: INFO
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      DOWNSTREAM_SECURITY_URL: "http://security-layer:8081"
      DOWNSTREAM_TIMEOUT_SECONDS: "600"
      ADMIN_PORTAL_URL: "http://admin-portal:8084"
      ADMIN_PORTAL_INTERNAL_KEY: ${ADMIN_PORTAL_INTERNAL_KEY}
      KEY_CACHE_TTL_SECONDS: "30"
      REDIS_URL: "redis://redis:6379"
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      # Published directly so /v1/chat/completions is reachable without going
      # through the portal-ui front door too, if you want a dedicated API port.
      - "8080:8080"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]

  # ---------------------------------------------------------------------
  # Frontend — portal_ui's own image, serving ONLY its static SPA files via
  # the plain default.conf baked into portal_ui/Dockerfile (SPA fallback,
  # no proxying). Deliberately not published to the host and not the front
  # door — the standalone "nginx" service below is. This service is
  # entirely optional: if you're not deploying portal_ui at all (e.g. a
  # real frontend team's own build takes its place), remove it and point
  # nginx's "location /" at wherever that build is served from instead.
  # ---------------------------------------------------------------------
  portal-ui:
    build:
      context: .
      dockerfile: portal_ui/Dockerfile
    container_name: llm-portal-ui
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — BusyBox wget in this image resolves
      # "localhost" to ::1 first, and nginx only listens on 0.0.0.0 (IPv4),
      # so the IPv6 attempt fails to connect even though the app is healthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------
  # Reverse proxy — the platform's single public front door. Deliberately
  # a plain, unmodified official image (no custom build) with routing
  # rules mounted in from deploy/nginx/portal.conf: / -> portal-ui,
  # /portal -> admin-portal, /v1 -> api-gateway. Kept fully independent of
  # portal-ui on purpose (separate service, separate image, no build
  # dependency between them) — if portal-ui isn't deployed, only "/" stops
  # working; /portal and /v1 (the actual API surface) are unaffected.
  # ---------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: llm-nginx
    restart: unless-stopped
    depends_on:
      admin-portal:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PUBLIC_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/portal/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  redis_data:
  postgres_data:
  ollama_data:
  audit_store_data:
  model_registry_data:
