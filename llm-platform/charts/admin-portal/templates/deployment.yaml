apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "admin-portal.fullname" . }}
  labels:
    {{- include "admin-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "admin-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "admin-portal.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "admin-portal.serviceAccountName" . }}
      # POC security context — run as non-root UID 1000, no privilege escalation.
      # hostNetwork, hostPID, and hostIPC are intentionally omitted (defaults to false).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: admin-portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: API_GATEWAY_URL
              value: {{ .Values.env.API_GATEWAY_URL | quote }}
            - name: AUDIT_STORE_URL
              value: {{ .Values.env.AUDIT_STORE_URL | quote }}
            - name: MODEL_REGISTRY_URL
              value: {{ .Values.env.MODEL_REGISTRY_URL | quote }}
            - name: GRAFANA_URL
              value: {{ .Values.env.GRAFANA_URL | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            # GATEWAY_API_KEY is sourced from the Secret, not plain values.
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "admin-portal.fullname" . }}-secret
                  key: gateway-api-key
          livenessProbe:
            httpGet:
              path: /portal/health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /portal/health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
