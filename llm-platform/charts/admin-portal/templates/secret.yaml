apiVersion: v1
kind: Secret
metadata:
  name: {{ include "admin-portal.fullname" . }}-secret
  labels:
    {{- include "admin-portal.labels" . | nindent 4 }}
type: Opaque
data:
  # GATEWAY_API_KEY is base64-encoded from values.yaml at render time.
  # Override via: --set env.GATEWAY_API_KEY=<your-key>
  gateway-api-key: {{ .Values.env.GATEWAY_API_KEY | b64enc | quote }}
