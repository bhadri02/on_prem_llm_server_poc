# Default values for admin-portal.
# POC scope: replicaCount 1, autoscaling disabled, vault disabled.

replicaCount: 1

image:
  repository: registry.local/admin-portal
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8084
  metricsPort: 9090

ingress:
  enabled: true
  className: nginx
  host: llm-portal.local
  path: /
  pathType: Prefix
  annotations: {}

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: false

vault:
  enabled: false

# Environment variables injected into the container.
# GATEWAY_API_KEY is stored in a Kubernetes Secret (see templates/secret.yaml)
# and mounted via secretKeyRef — it is NOT in plain env here.
env:
  API_GATEWAY_URL: "http://api-gateway:8080"
  AUDIT_STORE_URL: "http://audit-store:9200"
  MODEL_REGISTRY_URL: "http://model-registry:5000"
  GRAFANA_URL: "http://grafana:3000"
  GATEWAY_API_KEY: "poc-secret-key"
  LOG_LEVEL: "INFO"

serviceAccount:
  # Set to "" to skip service account binding and use the default SA.
  name: ""

nameOverride: ""
fullnameOverride: ""
