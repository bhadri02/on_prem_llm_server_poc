apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-framework.fullname" . }}
  labels:
    {{- include "agent-framework.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-framework.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  # INGRESS: Allow traffic ONLY from the Intelligent Router (Layer 3)
  ingress:
    # Allow HTTP requests to port 8083 from Router pods
    - from:
        - podSelector:
            matchLabels:
              app: router
      ports:
        - protocol: TCP
          port: 8083

    # Allow Prometheus to scrape metrics on port 9090
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090

  # EGRESS: Allow outbound to Router and DNS only
  egress:
    # Allow HTTP POST to the Router's /v1/chat/completions endpoint (port 8082)
    - to:
        - podSelector:
            matchLabels:
              app: router
      ports:
        - protocol: TCP
          port: 8082

    # Allow DNS resolution (kube-dns / CoreDNS on port 53 UDP and TCP)
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
