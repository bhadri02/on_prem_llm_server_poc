apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-framework.fullname" . }}
  labels:
    {{- include "agent-framework.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agent-framework.selectorLabels" . | nindent 4 }}
  ports:
    # Main application port — receives POST /agent/run from the Router
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
    # Prometheus metrics scrape port
    - name: metrics
      protocol: TCP
      port: {{ .Values.observability.metrics.port }}
      targetPort: metrics
