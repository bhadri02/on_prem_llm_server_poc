replicaCount: 1

image:
  repository: registry.local/api-gateway
  tag: ""          # MUST be overridden at deploy time — deploying with empty tag is invalid
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: llm-poc.local
      paths:
        - path: /v1
          pathType: Prefix
        - path: /health
          pathType: Exact

env:
  GATEWAY_API_KEY: "poc-secret-key"          # MUST be replaced before any non-dev deployment
  DOWNSTREAM_SECURITY_URL: "http://security-layer:8081"
  LOG_LEVEL: "INFO"
  PORT: "8080"
  METRICS_PORT: "9090"
  DOWNSTREAM_TIMEOUT: "10.0"
  RATE_LIMIT_REQUESTS: "60"
  RATE_LIMIT_WINDOW_SECONDS: "60"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: false   # no HPA for POC

vault:
  enabled: false   # secrets via env vars for POC

observability:
  metrics:
    enabled: true
    port: 9090
    scrapeInterval: "15s"
