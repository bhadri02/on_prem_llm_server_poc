apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "audit-store.fullname" . }}
  labels:
    {{- include "audit-store.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "audit-store.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "audit-store.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: audit-store
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: AUDIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: audit-store-secrets
                  key: AUDIT_API_KEY
            - name: DB_PATH
              value: {{ .Values.env.DB_PATH | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: 9200
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9200
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "audit-store.fullname" . }}-data
      {{- end }}
