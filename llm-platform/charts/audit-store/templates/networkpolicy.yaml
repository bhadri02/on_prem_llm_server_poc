apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "audit-store.fullname" . }}
  labels:
    {{- include "audit-store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "audit-store.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow port 9200 (API) from platform layer namespaces only
    - ports:
        - port: 9200
          protocol: TCP
      from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - llm-api-gateway
                  - llm-security
                  - llm-router
                  - llm-cache
                  - llm-inference
                  - llm-agent-framework
                  - llm-governance
    # Allow port 9090 (metrics) from observability namespace only
    - ports:
        - port: 9090
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm-observability
