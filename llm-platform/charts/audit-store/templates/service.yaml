apiVersion: v1
kind: Service
metadata:
  name: {{ include "audit-store.fullname" . }}
  labels:
    {{- include "audit-store.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "audit-store.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
