replicaCount: 1

image:
  repository: registry.local/audit-store
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9200

metricsPort: 9090

secretRef:
  name: "llm-poc-secrets"

serviceAccount:
  name: "llm-platform"

env:
  DB_PATH: "/data/audit.db"
  LOG_LEVEL: "INFO"

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  mountPath: "/data"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

livenessProbe:
  httpGet:
    path: /health
    port: 9200
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /health
    port: 9200
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

autoscaling:
  enabled: false

vault:
  enabled: false

observability:
  metrics:
    enabled: true
    port: 9090
