apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cache.fullname" . }}
  labels:
    {{- include "cache.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cache.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default "llm-platform" }}
      containers:
        - name: cache-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.secretRef.name }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
            - name: SIMILARITY_THRESHOLD
              value: {{ .Values.env.SIMILARITY_THRESHOLD | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.env.EMBEDDING_MODEL | quote }}
            - name: HF_HUB_OFFLINE
              value: {{ .Values.env.HF_HUB_OFFLINE | quote }}
            - name: TRANSFORMERS_OFFLINE
              value: {{ .Values.env.TRANSFORMERS_OFFLINE | quote }}
            - name: MAX_SEMANTIC_ENTRIES
              value: {{ .Values.env.MAX_SEMANTIC_ENTRIES | quote }}
            - name: CACHE_TTL_SECONDS
              value: {{ .Values.env.CACHE_TTL_SECONDS | quote }}
            - name: PORT
              value: "8086"
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
