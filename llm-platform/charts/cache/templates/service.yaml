apiVersion: v1
kind: Service
metadata:
  name: {{ include "cache.fullname" . }}
  labels:
    {{- include "cache.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8086
      protocol: TCP
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: 9090
      protocol: TCP
  selector:
    {{- include "cache.selectorLabels" . | nindent 4 }}
