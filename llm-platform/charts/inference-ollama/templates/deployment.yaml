apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference-ollama.fullname" . }}
  labels:
    {{- include "inference-ollama.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "inference-ollama.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inference-ollama.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: {{ .Values.ollama.env.OLLAMA_HOST | quote }}
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.ollama.env.OLLAMA_KEEP_ALIVE | quote }}
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: ollama-data
              mountPath: {{ .Values.persistence.mountPath }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
      volumes:
        - name: ollama-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: ollama-data
          {{- else }}
          emptyDir: {}
          {{- end }}
