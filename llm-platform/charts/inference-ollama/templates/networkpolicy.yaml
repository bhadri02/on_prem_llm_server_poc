{{/*
NetworkPolicy for the Inference Adapter pod.
  Ingress:  only from pods labelled app.kubernetes.io/name: router
  Egress:   only to pods labelled app.kubernetes.io/name: inference-ollama
This enforces the declared network route:
  Router → Adapter → Ollama
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inference-ollama.fullname" . }}-adapter
  labels:
    {{- include "inference-ollama.adapterLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "inference-ollama.adapterSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: router
      ports:
        - protocol: TCP
          port: 8087
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: inference-ollama
      ports:
        - protocol: TCP
          port: 11434
