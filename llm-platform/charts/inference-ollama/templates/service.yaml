{{/* Service: inference-adapter — exposes HTTP (8087) and Prometheus metrics (9090) */}}
apiVersion: v1
kind: Service
metadata:
  name: inference-adapter
  labels:
    {{- include "inference-ollama.adapterLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.adapter.service.port }}
      targetPort: 8087
      protocol: TCP
    - name: metrics
      port: {{ .Values.adapter.metricsPort }}
      targetPort: 9090
      protocol: TCP
  selector:
    {{- include "inference-ollama.adapterSelectorLabels" . | nindent 4 }}
---
{{/* Service: inference-ollama — exposes Ollama API (11434) */}}
apiVersion: v1
kind: Service
metadata:
  name: inference-ollama
  labels:
    {{- include "inference-ollama.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ollama.service.port }}
      targetPort: 11434
      protocol: TCP
  selector:
    {{- include "inference-ollama.selectorLabels" . | nindent 4 }}
