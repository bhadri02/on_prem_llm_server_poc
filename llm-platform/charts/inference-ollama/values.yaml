replicaCount: 1

# ---------------------------------------------------------------------------
# Secret reference — Kubernetes Secret injected via envFrom
# ---------------------------------------------------------------------------
secretRef:
  name: "llm-poc-secrets"

# ---------------------------------------------------------------------------
# Service account for all pods in this chart
# ---------------------------------------------------------------------------
serviceAccount:
  name: "llm-platform"

# ---------------------------------------------------------------------------
# Ollama inference engine
# ---------------------------------------------------------------------------
ollama:
  image:
    repository: "ollama/ollama"
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 11434

  resources:
    requests:
      cpu: "1"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

  env:
    OLLAMA_HOST: "0.0.0.0"
    OLLAMA_KEEP_ALIVE: "24h"

  livenessProbe:
    httpGet:
      path: /api/tags
      port: 11434
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 30
    failureThreshold: 5
    successThreshold: 1

  readinessProbe:
    httpGet:
      path: /api/tags
      port: 11434
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 30
    failureThreshold: 5
    successThreshold: 1

# ---------------------------------------------------------------------------
# Inference Adapter (FastAPI, IMF ↔ Ollama translation)
# ---------------------------------------------------------------------------
adapter:
  image:
    repository: "registry.local/inference-adapter"
    tag: ""          # set via CI --set adapter.image.tag=<sha>; defaults to "latest"
    pullPolicy: IfNotPresent

  service:
    port: 8087
  metricsPort: 9090

  env:
    DEFAULT_MODEL: "llama3.2:3b"
    LOG_LEVEL: "INFO"
    OLLAMA_BASE_URL: "http://inference-ollama:11434"
    OLLAMA_TIMEOUT_SECONDS: "120"
    DEFAULT_MAX_TOKENS: "2048"
    MAX_TOKENS_LIMIT: "4096"
    DEFAULT_TEMPERATURE: "0.7"

  livenessProbe:
    httpGet:
      path: /health
      port: 8087
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    httpGet:
      path: /health
      port: 8087
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

# ---------------------------------------------------------------------------
# Models to pre-pull via init Job
# ---------------------------------------------------------------------------
models:
  preload:
    - "llama3.2:3b"

# ---------------------------------------------------------------------------
# Persistent storage for Ollama model weights
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  size: "20Gi"
  storageClass: ""      # uses cluster default when empty
  mountPath: "/root/.ollama"

# ---------------------------------------------------------------------------
# Autoscaling — disabled for POC (single replica)
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false

# ---------------------------------------------------------------------------
# Vault secret injection — Phase 2
# ---------------------------------------------------------------------------
vault:
  enabled: false

# ---------------------------------------------------------------------------
# Init Job — pulls models into the Model_Store before Ollama is Ready
# ---------------------------------------------------------------------------
initJob:
  enabled: true
  image: "curlimages/curl:latest"
  pullTimeoutSeconds: 6000
  backoffLimit: 2
