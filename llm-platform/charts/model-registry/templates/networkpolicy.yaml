apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "model-registry.fullname" . }}
  labels:
    {{- include "model-registry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "model-registry.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm-platform
      ports:
        - protocol: TCP
          port: 5000
