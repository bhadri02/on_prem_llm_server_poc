apiVersion: v1
kind: Service
metadata:
  name: {{ include "model-registry.fullname" . }}
  labels:
    {{- include "model-registry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 5000
      protocol: TCP
  selector:
    {{- include "model-registry.selectorLabels" . | nindent 4 }}
