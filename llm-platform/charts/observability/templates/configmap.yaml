{{- if .Values.kubePrometheusStack.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-poc-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  poc-overview.json: |
    {{- .Files.Get "dashboards/poc-overview.json" | nindent 4 }}
{{- end }}
