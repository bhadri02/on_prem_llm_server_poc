apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "router.fullname" . }}-config
  labels:
    {{- include "router.labels" . | nindent 4 }}
data:
  model_matrix.yaml: |
    # model_matrix.yaml
    # Model capability matrix for the Intelligent Router (Layer 3).
    # Loaded once at startup; stored on app.state.model_matrix.
    # 'models' — registry of available inference backends.
    # 'task_defaults' — primary model selected for each task type in auto-routing mode.

    models:
      llama3.2-3b:
        backend: ollama
        endpoint: http://inference-ollama:11434
        tasks:
          - chat
          - code
          - reasoning
          - summarization
          - translation
        health_url: http://inference-ollama:11434/api/tags
        fallback: null

    task_defaults:
      chat: llama3.2-3b
      code: llama3.2-3b
      reasoning: llama3.2-3b
      summarization: llama3.2-3b
      translation: llama3.2-3b

  task_classifier_rules.yaml: |
    # task_classifier_rules.yaml
    # Keyword-based classification rules for the Intelligent Router (Layer 3).
    # Evaluated in PRIORITY_ORDER: code → reasoning → summarization → translation → chat (default).
    # Each keyword is matched as a case-insensitive substring of the concatenated message content.

    rules:
      code:
        - "code"
        - "function"
        - "python"
        - "javascript"
        - "debug"
        - "write a script"
        - "implement"
        - "class"
        - "method"
        - "algorithm"
        - "programming"
        - "compile"
        - "syntax"
        - "typescript"
        - "java"
        - "golang"
        - "rust"
        - "bash"
        - "shell"
        - "sql"
        - "html"
        - "css"
        - "api"
        - "endpoint"
        - "library"
        - "framework"
        - "test"
        - "unit test"
        - "refactor"
        - "optimize code"

      reasoning:
        - "reason"
        - "analyze"
        - "analyse"
        - "logic"
        - "deduce"
        - "infer"
        - "conclude"
        - "prove"
        - "argument"
        - "hypothesis"
        - "evaluate"
        - "assess"
        - "think step by step"
        - "chain of thought"
        - "explain why"
        - "compare and contrast"
        - "pros and cons"
        - "decision"
        - "trade-off"
        - "critique"
        - "justify"

      summarization:
        - "summarize"
        - "summarise"
        - "summary"
        - "tldr"
        - "brief"
        - "overview"
        - "recap"
        - "condense"
        - "shorten"
        - "key points"
        - "main points"
        - "abstract"
        - "digest"
        - "outline"
        - "synopsis"

      translation:
        - "translate"
        - "translation"
        - "in french"
        - "in spanish"
        - "in german"
        - "in chinese"
        - "in japanese"
        - "in arabic"
        - "in portuguese"
        - "in italian"
        - "in russian"
        - "en français"
        - "auf deutsch"
        - "convert to language"
        - "language version"

    default: chat
