apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "security-layer.fullname" . }}-patterns
  labels:
    {{- include "security-layer.labels" . | nindent 4 }}
data:
  injection_patterns.yaml: |
    patterns:
      - "ignore previous instructions"
      - "ignore all instructions"
      - "you are now"
      - "disregard your"
      - "forget your training"
      - "act as if"
      - "pretend you are"
      - "\\{\\{.*\\}\\}"
      - "<\\?.*\\?>"
