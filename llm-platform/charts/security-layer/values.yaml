replicaCount: 1

image:
  repository: registry.local/security-layer
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

env:
  LOG_LEVEL: "INFO"
  DOWNSTREAM_ROUTER_URL: "http://router:8082"
  PII_ENABLED: "true"
  INJECTION_PATTERNS_PATH: "/config/injection_patterns.yaml"
  # AUDIT_STORE_URL and AUDIT_API_KEY must be supplied at deploy time
  # via --set or a Kubernetes Secret named security-layer-secrets

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

observability:
  metrics:
    enabled: true
    port: 9090
  tracing:
    enabled: false
    endpoint: "http://otel-collector:4317"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

vault:
  enabled: false
  role: "security-layer-role"
  secretPath: "secret/llm-platform/security-layer"
