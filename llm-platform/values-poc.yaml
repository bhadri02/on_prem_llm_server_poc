global:
  imageRegistry: registry.local

# Enable all sub-charts
apiGateway:
  enabled: true
  ingress:
    enabled: true

securityLayer:
  enabled: true

router:
  enabled: true

cache:
  enabled: true

inferenceOllama:
  enabled: true
  models:
    preload:
      - "llama3.2:3b"

agentFramework:
  enabled: true

modelRegistry:
  enabled: true

auditStore:
  enabled: true

adminPortal:
  enabled: true
  ingress:
    enabled: true

observability:
  enabled: true
  ingress:
    enabled: true

# POC-wide settings
replicaCount: 1
autoscaling:
  enabled: false
vault:
  enabled: false

# Service discovery — short-form DNS, all services in llm-poc namespace
services:
  apiGateway: "http://api-gateway:8080"
  securityLayer: "http://security-layer:8081"
  router: "http://router:8082"
  cache: "http://cache:8086"
  inferenceOllama: "http://inference-ollama:11434"
  inferenceAdapter: "http://inference-ollama:8087"
  agentFramework: "http://agent-framework:8083"
  modelRegistry: "http://model-registry:5000"
  auditStore: "http://audit-store:9200"
  adminPortal: "http://admin-portal:8084"
