# Local-only reverse proxy for testing the "front three published ports with
# your own nginx" architecture (see docs/DEPLOYMENT.md). This file is NOT
# part of the deployed stack — it's a throwaway container config used to
# verify the same location-block shape you'll add to your real on-prem nginx.
#
# Runs as its own container on the llm-platform-prod compose network, so it
# reaches the other services by their Compose service name (not 127.0.0.1 —
# that form is for when nginx runs on the Docker host itself, e.g. the real
# on-prem server).

server {
    listen 80;

    location / {
        proxy_pass http://portal-ui:8080;
        proxy_set_header Host $host;
    }

    location /portal/ {
        proxy_pass http://admin-portal:8084;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
    }
}
