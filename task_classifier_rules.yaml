# task_classifier_rules.yaml
# Keyword-based classification rules for the Intelligent Router (Layer 3).
# Evaluated in PRIORITY_ORDER: code → reasoning → summarization → translation → chat (default).
# Each keyword is matched as a case-insensitive substring of the concatenated message content.

rules:
  code:
    - "code"
    - "function"
    - "python"
    - "javascript"
    - "debug"
    - "write a script"
    - "implement"
    - "class"
    - "method"
    - "algorithm"
    - "programming"
    - "compile"
    - "syntax"
    - "typescript"
    - "java"
    - "golang"
    - "rust"
    - "bash"
    - "shell"
    - "sql"
    - "html"
    - "css"
    - "api"
    - "endpoint"
    - "library"
    - "framework"
    - "test"
    - "unit test"
    - "refactor"
    - "optimize code"

  reasoning:
    - "reason"
    - "analyze"
    - "analyse"
    - "logic"
    - "deduce"
    - "infer"
    - "conclude"
    - "prove"
    - "argument"
    - "hypothesis"
    - "evaluate"
    - "assess"
    - "think step by step"
    - "chain of thought"
    - "explain why"
    - "compare and contrast"
    - "pros and cons"
    - "decision"
    - "trade-off"
    - "critique"
    - "justify"

  summarization:
    - "summarize"
    - "summarise"
    - "summary"
    - "tldr"
    - "brief"
    - "overview"
    - "recap"
    - "condense"
    - "shorten"
    - "key points"
    - "main points"
    - "abstract"
    - "digest"
    - "outline"
    - "synopsis"

  translation:
    - "translate"
    - "translation"
    - "in french"
    - "in spanish"
    - "in german"
    - "in chinese"
    - "in japanese"
    - "in arabic"
    - "in portuguese"
    - "in italian"
    - "in russian"
    - "en français"
    - "auf deutsch"
    - "convert to language"
    - "language version"

default: chat
